name: Build Aldurra v2 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "Aldurra_V2_BuildKit.part-*"
      - ".github/workflows/build-aldurra.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble build kit
        shell: bash
        run: |
          test -f Aldurra_V2_BuildKit.part-00
          test -f Aldurra_V2_BuildKit.part-01
          cat Aldurra_V2_BuildKit.part-* > Aldurra_V2_No_Android_Studio_Build_Kit.zip
          echo "3a26f41a89a8059afe682a1990a4d285fe4252b141f32dde19a777ad445d703b  Aldurra_V2_No_Android_Studio_Build_Kit.zip" | sha256sum -c -

      - name: Extract Aldurra source
        shell: bash
        run: |
          mkdir buildkit
          unzip -q Aldurra_V2_No_Android_Studio_Build_Kit.zip -d buildkit
          PROJECT_DIR="$(find buildkit -type f -name settings.gradle -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify original Aldurra content lock
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python3 verify_content.py

      - name: Build installable APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Aldurra-v2-test.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aldurra-v2-APK
          path: Aldurra-v2-test.apk
          if-no-files-found: error
          retention-days: 30
